name: ZIP-Modpack fuer La Familia Launcher vorbereiten

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bestehender Modpack-Release-Entwurf, z. B. 1.0.1'
        required: true
        default: '1.0.1'
        type: string

permissions:
  contents: write

concurrency:
  group: modpack-zip-conversion
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Vorbedingungen und Entwurf pruefen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versionsnummer muss x.y.z sein"
            exit 1
          fi
          TAG="modpack-v$VERSION"
          IS_DRAFT=$(gh release view "$TAG" --repo LaFamiliaMC/LaFamilia-Modpack --json isDraft --jq '.isDraft')
          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "::error::Es darf nur ein vorhandener Release-Entwurf bearbeitet werden!"
            exit 1
          fi
          mkdir -p .pack-input .pack-output
      - name: ZIP-Dateien aus dem GitHub-Entwurf laden
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release download "modpack-v$VERSION" --repo LaFamiliaMC/LaFamilia-Modpack --pattern 'mods.zip' --pattern 'resourcepacks.zip' --pattern 'config.zip' --dir .pack-input
      - name: ZIP-Dateien vorab zaehlen und problematische Configs melden
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for category in ('mods','resourcepacks','config'):
              archive = Path('.pack-input') / (category + '.zip')
              with ZipFile(archive) as zipped:
                  entries = [entry for entry in zipped.infolist() if not entry.is_dir()]
                  count = len(entries)
                  limit = 950 if category == 'mods' else 40000
                  total = sum(entry.file_size for entry in entries)
                  print(f"{category}: {count} Dateien, unkomprimiert {total:,} Bytes", flush=True)
                  if count > limit:
                      print(f"::error::{category}.zip enthaelt {count} Dateien; die Launcher-Grenze liegt bei {limit}. Bitte nicht benoetigte Cache-, Log-, Backup- und temporaere Dateien entfernen.")
                      raise SystemExit(1)
          PY
      - name: Alle Dateien pruefen und manifest.json generieren
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/prepare_modpack_release.py --input .pack-input --output .pack-output --version "$VERSION"
      - name: Einzelne Mod-JARs in den Release-Entwurf laden
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub CLI interpretiert [..], ? und * in Asset-Namen als Globs.
          # Das Format PFAD#ASSETNAME setzt den gewünschten Release-Namen explizit
          # und lässt Quellpfade mit Klammern und sonstigen Zeichen unverändert.
          # Bereits hochgeladene Assets werden per --clobber idempotent aktualisiert.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.parse
          version = os.environ["VERSION"]
          manifest = json.loads(Path(".pack-output/manifest.json").read_text("utf-8"))
          rows = []
          for entry in manifest["mods"]:
              name = urllib.parse.unquote(entry["url"].rsplit("/", 1)[-1])
              src = Path(".pack-output/assets") / name
              if not src.is_file():
                  raise SystemExit("Quelldatei fehlt: " + str(src))
              rows.append((str(src), name, entry["size"], entry["sha256"]))
          response = subprocess.run(
              ["gh", "release", "view", "modpack-v" + version, "--repo",
               "LaFamiliaMC/LaFamilia-Modpack", "--json", "assets"],
              check=True, capture_output=True, text=True)
          remote = {a["name"]: a for a in json.loads(response.stdout)["assets"]}
          pending = []
          for src, name, size, sha in rows:
              existing = remote.get(name)
              if existing and existing.get("size") == size and existing.get("digest") == "sha256:" + sha:
                  continue
              pending.append(src + "#" + name)
          print("Vorhandene verifizierte Mods:", len(rows)-len(pending),
                "Fehlende/abweichende:", len(pending), flush=True)
          for offset in range(0, len(pending), 10):
              batch = pending[offset:offset+10]
              print("Mod-Dateien hochladen:", min(offset+len(batch), len(pending)),
                    "/", len(pending), flush=True)
              subprocess.run(["gh", "release", "upload", "modpack-v" + version,
                  "--repo", "LaFamiliaMC/LaFamilia-Modpack", "--clobber",
                  *batch], check=True)
          PY
      - name: Alle Assets vor Manifest-Upload pruefen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "modpack-v$VERSION" --repo LaFamiliaMC/LaFamilia-Modpack --json assets > .pack-output/remote-assets.json
          python3 - <<'PY'
          import json,sys,urllib.parse
          from pathlib import Path
          data=json.loads(Path('.pack-output/manifest.json').read_text('utf-8'))
          remote=json.loads(Path('.pack-output/remote-assets.json').read_text('utf-8'))
          assets={a['name']:a for a in remote['assets']}
          expected=[*data['mods'],
             data['resourcepacks']['archive'],data['config']['archive']]
          for item in expected:
              name=urllib.parse.unquote(item['url'].rsplit('/',1)[-1])
              if not name or name not in assets:
                  sys.exit('GitHub-Datei fehlt: '+str(name))
              value=assets[name]
              if value.get('size') != item['size']:
                  sys.exit('GitHub-Dateigroesse weicht ab: '+name)
              if value.get('digest') and value['digest'] != 'sha256:'+item['sha256']:
                  sys.exit('GitHub-Pruefsumme weicht ab: '+name)
          print('Alle Mod-Dateien und Archive sind auf GitHub vorhanden.')
          PY
      - name: manifest.json zuletzt hochladen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release upload "modpack-v$VERSION" .pack-output/manifest.json --repo LaFamiliaMC/LaFamilia-Modpack --clobber
          echo "Entwurf vorbereitet. Bitte Release erst nach Pruefung manuell veroeffentlichen."
