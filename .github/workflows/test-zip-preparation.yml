name: Modpack ZIP Preparation Tests

on:
  push:
    paths:
      - 'scripts/prepare_modpack_release.py'
      - 'tests/test_prepare_modpack_release.py'
      - '.github/workflows/test-zip-preparation.yml'
  pull_request:
    paths:
      - 'scripts/prepare_modpack_release.py'
      - 'tests/test_prepare_modpack_release.py'
      - '.github/workflows/test-zip-preparation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Test safe ZIP processing and schema-2 manifest
        run: python -m unittest discover -s tests -p 'test_*.py' -v
